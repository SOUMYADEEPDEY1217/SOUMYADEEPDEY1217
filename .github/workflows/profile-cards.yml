name: Refresh animated GitHub profile cards
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/render_profile_cards.py", ".github/workflows/profile-cards.yml"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font subsetting dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fonttools[woff]" brotli
      - name: Refresh contribution JSON and render cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile_cards.py
      - name: Commit refreshed data and cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated profile cards"
            git push
          fi
